name: Validate pattern settings
on:
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: php -l modfarm-theme/modfarm-theme/functions.php
      - run: php -l modfarm-theme/modfarm-theme/inc/modfarm-settings.php
      - run: node --check modfarm-theme/modfarm-theme/assets/js/modfarm-settings-ui.js
      - run: node tests/pattern-settings-save.cjs
      - run: php tests/offer-archive-pattern.php
